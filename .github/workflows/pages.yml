name: Deploy Yeolbang Finance to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build privacy-safe static site
        run: |
          mkdir -p _site/assets _site/vendor
          cp index.html styles.css imports.css app.js ext.css ext-core.js ext-finance.js ext-church.js firebase-config.js firebase-sync.js members-loader.js manifest.webmanifest service-worker.js FIREBASE_GITHUB_SETUP.md _site/
          cp assets/yeolbang-church-logo-original.jpg assets/yeolbang-church-seal.png _site/assets/
          cp assets/pwa-icon-192.png assets/pwa-icon-512.png _site/assets/
          cp vendor/xlsx.full.min.js _site/vendor/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
